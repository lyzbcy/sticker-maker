# Include only inside the existing TLS server block; do not replace existing routes.
location = /sticker-maker-feedback/health {
    access_log off;
    proxy_pass http://127.0.0.1:18774/health;
}
location = /sticker-maker-feedback/feedback {
    access_log off;
    client_max_body_size 12k;
    client_body_timeout 10s;
    proxy_read_timeout 55s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:18774/feedback;
}
