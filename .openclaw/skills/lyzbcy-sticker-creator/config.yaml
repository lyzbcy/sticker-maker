# AI 模板设置
ai_template:
  background_mode: transparent
  background_prompts: backgrounds.json
  keywords_file: keywords.json
  used_combinations: used_combinations.txt
quota:
  thresholds:
  - min: 50
    local_prob: 0.95
  - min: 20
    local_prob: 0.9
  - min: 10
    local_prob: 0.7
  - min: 4
    local_prob: 0.5
  - min: 0
    local_prob: 0.0
generation:
  mode: single
  quad_count: 3
  dynamic: false
  frame_duration: 100
  default_grid: 4
publish:
  auto_publish: false
  copyright: 捞鱼真不吃鱼
  type: 卡通表情/其他
  style: 日常
  theme: 万能通用
  region: 全球
quality_style:
  character:
    style: Q版可爱风格，大头小身（1:1.2头身比）
    line_art: 干净描边，粗细适中，边缘清晰
    features: 标志性元素突出（眼镜、发型等）
  expression:
    clarity: 情绪传达明确，一眼就能看懂
    action: 动作夸张但可爱，配合表情
    body_language: 肢体语言丰富（举手、比心、捂脸等）
  color:
    tone: 柔和温暖，不刺眼
    skin: 自然白皙，带轻微红润
    shadow: 禁止投射阴影(drop/contact/ground shadow)，否则洋红背景抠不干净；立体感靠材质本身明暗渐变
    background: 干净简洁，突出角色
  composition:
    position: 角色居中或略偏上
    whitespace: 适当留白，不拥挤
    balance: 画面平衡
crop:
  grid_4_padding: 10
  grid_3_padding: 3
  grid_2_padding: 5
  note: '宫格裁剪内缩边距(像素)，main.py 从此读取并传 --padding。grid_4 由 2 提至 10 以兜底邻格渗入。'
chroma_key:
  background_color: '#ff00ff'
  key_color_rgb:
  - 255
  - 0
  - 255
  fallback_color: '#00ff00'
  auto_key: border
  tolerance: 150
  edge_feather: 0
  edge_contract: 1
  soft_matte: true
  transparent_threshold: 150
  opaque_threshold: 155
  note: '色度键参数（main.py 全部从此读取，单一来源）。2026-06 优化：原先 tolerance=85
    + soft_matte=false 会导致角色边缘洋红阴影残留（粉色边）+ 锯齿。经实测验证修正：
    周三涵粉肤色到洋红(255,0,255)的通道距离 min=156（远大于阈值），因此把阈值提到
    150 完全不会误伤肤色。关键数据：距离86-150的像素是洋红投影阴影（平均RGB 216,22,203，
    R/B高G低=洋红偏暗），必须抠掉；肤色距离≥156，安全。新方案 soft_matte=true +
    transparent_threshold=150 + opaque_threshold=155：阴影区(≤150)全透明，过渡区(150-155)
    半透明渐变消除锯齿，≥155全保留。比旧方案（硬阈值85）粉边几乎消除、边缘明显平滑。
    edge_contract 1 仍保留用于收缩洋红混色边。auto-key=border(NOT corners)避免角色占角采样污染。
    🔴 2026-06 源头治理：生图端 prompt 已全面禁止生成投影阴影（drop/contact/ground/cast
    shadow，改 flat front lighting）。投影阴影本质是「洋红背景调暗」，与洋红重叠抠不干净，
    是粉边问题根因。禁阴影后新弹次不再产生阴影残留；本阈值150仅用于兜底历史已生成的带阴影图。
    🔴 2026-06-26 hue-guard 修正（重要）：上述"阈值150不会误伤肤色"的论断只对肤色成立，
    对红色/粉红色衣服失效——红衣色相H≈335°距洋红H≈300°仅35°，通道距离落在86-150阴影区
    被误抠（32/41弹"衣服染色"故事衣服被抠成破洞）。根因：同类色在RGB通道距离上必然重叠。
    修复方案：remove_chroma_key.py 加 HSV 双判据 hue-guard（默认开启）：只有色相距300°≤20°
    且饱和度S≥0.85才判为洋红可抠，否则强制保护。物理依据：洋红背景S≈0.98（纯色填充）vs
    黏土哑光角色S≈0.6（漫反射），饱和度几乎不重叠是材质本质差异。详见 troubleshooting 第7坑。
    回归验证：正常图额外丢失0像素（零退化），红衣误伤率16-23%→2%，真洋红残留<25px不变。'
