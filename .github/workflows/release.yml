# 双平台发布流水线：push tag v* 触发，一次出 Mac zip + Windows NSIS 安装包
# 产物结构：
#   sticker-maker-mac-v{v}.zip        —— 表情包一键制作.app + install.command（与 v0.2.0 手动包一致，老客户端一键更新兼容）
#   sticker-maker-win-v{v}-setup.exe   —— NSIS 安装器（静默参数 /S）
# 发布完成后自动更新 desktop/site/version.json（双平台 schema），Pages 自动重部署。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write   # 回写 version.json 后触发 Pages 重部署（GITHUB_TOKEN 的 push 不会触发其他 workflow）

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest     # Apple Silicon
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python engine (PyInstaller)
        working-directory: sticker_engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          pyinstaller sticker-engine-cli.spec --noconfirm

      - name: Build Electron app
        working-directory: desktop
        run: |
          npm ci
          npx vite build
          npx electron-builder --${{ matrix.platform == 'mac' && 'mac --arm64' || 'win --x64' }} --publish never

      # Mac：手动包是 .app + install.command 并排的 zip；electron-builder dir 产物 + install.command 用 ditto 压缩
      - name: Pack Mac zip (app + install.command)
        if: matrix.platform == 'mac'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          # electron-builder 的 dir 产物目录名随 arch/版本可能是 mac/ 或 mac-arm64/，用 find 兜底
          APP=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app，release 目录内容："
            find release -maxdepth 2 | head -30
            exit 1
          fi
          echo "找到应用：$APP"
          APP_NAME=$(basename "$APP")
          STAGE="release/stage-mac"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cp install.command "$STAGE/"
          (
            cd "$STAGE"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "sticker-maker-mac-v${VERSION}.zip"
            /usr/bin/zip -j "sticker-maker-mac-v${VERSION}.zip" install.command
          )
          mv "$STAGE/sticker-maker-mac-v${VERSION}.zip" "release/"
          echo "zip 内容预览："
          unzip -l "release/sticker-maker-mac-v${VERSION}.zip" | head -6

      - name: Compute sha256
        shell: bash
        working-directory: desktop/release
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            ASSET="sticker-maker-mac-v${GITHUB_REF_NAME#v}.zip"
          else
            ASSET=$(ls sticker-maker-win-*-setup.exe | head -1)
          fi
          sha256sum "$ASSET" | awk '{print $1}' > "sha256-${{ matrix.platform }}.txt"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"
          cat "sha256-${{ matrix.platform }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            desktop/release/sticker-maker-*
            desktop/release/sha256-*.txt
          if-no-files-found: error

  release:
    name: create release + update version.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p assets
          find artifacts -name 'sticker-maker-*' -exec cp {} assets/ \;
          MAC_SHA=$(cat artifacts/release-mac/sha256-mac.txt)
          WIN_SHA=$(cat artifacts/release-win/sha256-win.txt)
          echo "MAC_SHA=$MAC_SHA" >> "$GITHUB_ENV"
          echo "WIN_SHA=$WIN_SHA" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 表情包一键制作 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: assets/*

      - name: Update site version.json (dual-platform schema)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="lyzbcy/sticker-maker"
          BASE="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"
          TODAY=$(date +%F)
          cat > desktop/site/version.json <<EOF
          {
            "version": "${VERSION}",
            "downloadUrl": "${BASE}/sticker-maker-mac-v${VERSION}.zip",
            "sha256": "${MAC_SHA}",
            "platforms": {
              "mac": {
                "url": "${BASE}/sticker-maker-mac-v${VERSION}.zip",
                "sha256": "${MAC_SHA}"
              },
              "win": {
                "url": "${BASE}/sticker-maker-win-v${VERSION}-setup.exe",
                "sha256": "${WIN_SHA}"
              }
            },
            "releaseNotes": "v0.4.0：作品库全新表格视图＋一键更新上架状态＋物理删除；逐张打分与备注、一键复制反哺提示词；多套生图方案可切换（内置萌系大头/标准版）；参考图用完自动归档防雷同；修复详情页表情与含义词错位。",
            "lastUpdated": "${TODAY}"
          }
          EOF
          # 同步介绍页 data-version（页面自身会按 version.json 强刷，这里保持一致更干净）
          sed -i "s/data-version=\"[^\"]*\"/data-version=\"${VERSION}\"/" desktop/site/index.html
          cat desktop/site/version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desktop/site/version.json desktop/site/index.html
          git commit -m "chore(release): 更新 version.json 至 ${GITHUB_REF_NAME}（双平台）" || echo "no changes"
          git push origin HEAD:main

      # GITHUB_TOKEN 的 push 不触发其他 workflow，必须显式 dispatch Pages 部署
      # （默认 token 不自动注入 shell env，必须 env 显式传入，否则 401）
      - name: Trigger Pages redeploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "pages.yml dispatch 已发送"
