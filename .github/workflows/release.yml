# 双平台发布流水线：push tag v* 触发，一次出 Mac zip + Windows NSIS 安装包
# 产物结构：
#   sticker-maker-mac-v{v}.zip        —— 表情包一键制作.app + install.command（与 v0.2.0 手动包一致，老客户端一键更新兼容）
#   sticker-maker-win-v{v}-setup.exe   —— NSIS 安装器（静默参数 /S）
# 发布完成后自动更新 desktop/site/version.json（双平台 schema），Pages 自动重部署。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest     # Apple Silicon
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python engine (PyInstaller)
        working-directory: sticker_engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          pyinstaller sticker-engine-cli.spec --noconfirm

      - name: Build Electron app
        working-directory: desktop
        run: |
          npm ci
          npx vite build
          npx electron-builder --${{ matrix.platform == 'mac' && 'mac --arm64' || 'win --x64' }} --publish never

      # Mac：手动包是 .app + install.command 并排的 zip；electron-builder dir 产物 + install.command 用 ditto 压缩
      - name: Pack Mac zip (app + install.command)
        if: matrix.platform == 'mac'
        working-directory: desktop
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          STAGE="release/stage-mac"
          mkdir -p "$STAGE"
          cp -R "release/mac/表情包一键制作.app" "$STAGE/"
          cp install.command "$STAGE/"
          (cd "$STAGE" && /usr/bin/ditto -c -k --sequesterRsrc --keepParent "表情包一键制作.app" "sticker-maker-mac-v${VERSION}.zip" && zip -j "sticker-maker-mac-v${VERSION}.zip" install.command)
          mv "$STAGE/sticker-maker-mac-v${VERSION}.zip" "release/"

      - name: Compute sha256
        shell: bash
        working-directory: desktop/release
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            ASSET="sticker-maker-mac-v${GITHUB_REF_NAME#v}.zip"
          else
            ASSET=$(ls sticker-maker-win-*-setup.exe | head -1)
          fi
          sha256sum "$ASSET" | awk '{print $1}' > "sha256-${{ matrix.platform }}.txt"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"
          cat "sha256-${{ matrix.platform }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            desktop/release/sticker-maker-*
            desktop/release/sha256-*.txt
          if-no-files-found: error

  release:
    name: create release + update version.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p assets
          find artifacts -name 'sticker-maker-*' -exec cp {} assets/ \;
          MAC_SHA=$(cat artifacts/release-mac/sha256-mac.txt)
          WIN_SHA=$(cat artifacts/release-win/sha256-win.txt)
          echo "MAC_SHA=$MAC_SHA" >> "$GITHUB_ENV"
          echo "WIN_SHA=$WIN_SHA" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 表情包一键制作 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: assets/*

      - name: Update site version.json (dual-platform schema)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="lyzbcy/sticker-maker"
          BASE="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"
          TODAY=$(date +%F)
          cat > desktop/site/version.json <<EOF
          {
            "version": "${VERSION}",
            "downloadUrl": "${BASE}/sticker-maker-mac-v${VERSION}.zip",
            "sha256": "${MAC_SHA}",
            "platforms": {
              "mac": {
                "url": "${BASE}/sticker-maker-mac-v${VERSION}.zip",
                "sha256": "${MAC_SHA}"
              },
              "win": {
                "url": "${BASE}/sticker-maker-win-v${VERSION}-setup.exe",
                "sha256": "${WIN_SHA}"
              }
            },
            "releaseNotes": "双平台版：新增 Windows 安装包，Mac/Windows 一套代码同时发布。",
            "lastUpdated": "${TODAY}"
          }
          EOF
          # 同步介绍页 data-version（页面自身会按 version.json 强刷，这里保持一致更干净）
          sed -i "s/data-version=\"[^\"]*\"/data-version=\"${VERSION}\"/" desktop/site/index.html
          cat desktop/site/version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desktop/site/version.json desktop/site/index.html
          git commit -m "chore(release): 更新 version.json 至 ${GITHUB_REF_NAME}（双平台）" || echo "no changes"
          git push origin HEAD:main
